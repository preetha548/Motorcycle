
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motorcycle Animation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: #87ceeb;
    transition: background 1s;
}

.scene {
    height: 100vh;
    width: 100%;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#68c5ff, #e5f8ff);
    transition: background 1s;
}

h1 {
    text-align: center;
    padding-top: 35px;
    color: #172554;
    font-size: clamp(25px, 4vw, 45px);
    letter-spacing: 3px;
    text-shadow: 2px 2px white;
}

.subtitle {
    text-align: center;
    margin-top: 12px;
    color: #243b53;
    letter-spacing: 2px;
}

.sun {
    position: absolute;
    top: 100px;
    right: 12%;
    width: 85px;
    height: 85px;
    background: #ffdf55;
    border-radius: 50%;
    box-shadow: 0 0 45px #ffdf55;
    animation: sunGlow 3s infinite alternate;
}

@keyframes sunGlow {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
}

.cloud {
    position: absolute;
    width: 120px;
    height: 35px;
    background: white;
    border-radius: 50px;
    opacity: .9;
    animation: cloudMove 18s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 50px;
    height: 50px;
    top: -25px;
    left: 18px;
}

.cloud::after {
    width: 65px;
    height: 60px;
    top: -30px;
    right: 15px;
}

.cloud.one {
    top: 150px;
    left: -150px;
}

.cloud.two {
    top: 250px;
    left: -300px;
    transform: scale(.7);
    animation-delay: -9s;
}

@keyframes cloudMove {
    from { left: -180px; }
    to { left: 110%; }
}

.mountains {
    position: absolute;
    bottom: 200px;
    width: 100%;
    height: 250px;
    background: #75b85a;
    clip-path: polygon(
        0 100%, 0 65%, 15% 15%, 30% 75%,
        43% 30%, 58% 80%, 73% 10%, 91% 75%,
        100% 40%, 100% 100%
    );
}

.hill {
    position: absolute;
    bottom: 180px;
    width: 130%;
    height: 140px;
    left: -10%;
    border-radius: 50% 50% 0 0;
    background: #3d9949;
}

.road {
    position: absolute;
    bottom: 0;
    height: 190px;
    width: 100%;
    background: #292d32;
    border-top: 8px solid #f7f7f7;
}

.road::before {
    content: "";
    position: absolute;
    top: 88px;
    left: 0;
    width: 200%;
    height: 8px;
    background: repeating-linear-gradient(
        to right,
        #fff 0 75px,
        transparent 75px 145px
    );
    animation: roadMove 1s linear infinite;
}

@keyframes roadMove {
    from { transform: translateX(0); }
    to { transform: translateX(-145px); }
}

.motorcycle {
    position: absolute;
    bottom: 90px;
    left: -320px;
    width: 300px;
    height: 180px;
    animation: ride 7s linear infinite;
    z-index: 5;
}

@keyframes ride {
    0% { left: -320px; }
    100% { left: calc(100% + 20px); }
}

.bike {
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: bounce .25s infinite alternate;
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-3px); }
}

.wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: rotateWheel .5s linear infinite;
}

@keyframes rotateWheel {
    to { transform: rotate(360deg); }
}

.controls {
    position: absolute;
    top: 25px;
    right: 25px;
    display: flex;
    gap: 10px;
    z-index: 10;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    background: #172554;
    color: white;
    box-shadow: 0 4px 10px #0002;
}

button:hover {
    background: #e63946;
    transform: translateY(-2px);
}

.caption {
    position: absolute;
    bottom: 205px;
    width: 100%;
    text-align: center;
    color: #172554;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.night {
    background: linear-gradient(#080d29, #243b63);
}

.night .sun {
    background: #f5f3ce;
    box-shadow: 0 0 25px #fff;
}

.night h1,
.night .subtitle,
.night .caption {
    color: white;
    text-shadow: 1px 1px 4px #111;
}

.night .mountains {
    background: #25364b;
}

.night .hill {
    background: #152a36;
}

@media (max-width: 600px) {
    .controls {
        top: 15px;
        right: 10px;
        flex-direction: column;
    }

    .controls button {
        padding: 9px 12px;
        font-size: 12px;
    }

    h1 {
        padding-top: 100px;
    }

    .motorcycle {
        width: 240px;
        height: 145px;
    }

    .road {
        height: 160px;
    }

    .caption {
        bottom: 175px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="sun"></div>
    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <h1>RIDE THE FUTURE</h1>
    <p class="subtitle">POWER • SPEED • FREEDOM</p>

    <div class="controls">
        <button onclick="toggleRide()" id="rideButton">
            ⏸ Pause Ride
        </button>
        <button onclick="toggleNight()" id="nightButton">
            🌙 Night Mode
        </button>
        <button onclick="changeSpeed()">
            ⚡ Change Speed
        </button>
    </div>

    <div class="mountains"></div>
    <div class="hill"></div>

    <div class="caption">BUILT FOR THE OPEN ROAD</div>

    <div class="motorcycle" id="motorcycle">

        <svg class="bike" viewBox="0 0 300 180"
             xmlns="http://www.w3.org/2000/svg">

            <!-- Rear wheel -->
            <g class="wheel">
                <circle cx="65" cy="130" r="38"
                        fill="#111" stroke="#555" stroke-width="5"/>
                <circle cx="65" cy="130" r="26"
                        fill="#aaa" stroke="#eee" stroke-width="3"/>
                <circle cx="65" cy="130" r="7" fill="#333"/>
                <g stroke="#555" stroke-width="3">
                    <line x1="65" y1="104" x2="65" y2="156"/>
                    <line x1="39" y1="130" x2="91" y2="130"/>
                    <line x1="47" y1="112" x2="83" y2="148"/>
                    <line x1="47" y1="148" x2="83" y2="112"/>
                </g>
            </g>

            <!-- Front wheel -->
            <g class="wheel">
                <circle cx="235" cy="130" r="38"
                        fill="#111" stroke="#555" stroke-width="5"/>
                <circle cx="235" cy="130" r="26"
                        fill="#aaa" stroke="#eee" stroke-width="3"/>
                <circle cx="235" cy="130" r="7" fill="#333"/>
                <g stroke="#555" stroke-width="3">
                    <line x1="235" y1="104" x2="235" y2="156"/>
                    <line x1="209" y1="130" x2="261" y2="130"/>
                    <line x1="217" y1="112" x2="253" y2="148"/>
                    <line x1="217" y1="148" x2="253" y2="112"/>
                </g>
            </g>

            <!-- Motorcycle frame -->
            <g stroke="#333" stroke-width="7"
               stroke-linecap="round" fill="none">
                <path d="M65 130 L105 85 L155 130 L65 130"/>
                <path d="M105 85 L178 80 L155 130"/>
                <path d="M155 130 L215 78"/>
                <path d="M215 78 L235 130"/>
            </g>

            <!-- Fuel tank -->
            <path d="M105 75 Q125 57 155 72
                     L177 88 L145 99 L110 94 Z"
                  fill="#e63946" stroke="#8c1522" stroke-width="3"/>

            <!-- Seat -->
            <path d="M76 70 L117 70 L128 79 L90 82 Z"
                  fill="#222" stroke="#111" stroke-width="3"/>

            <!-- Rear body -->
            <path d="M72 78 L104 82 L99 101
                     L67 102 L55 91 Z"
                  fill="#d62839" stroke="#8c1522" stroke-width="3"/>

            <!-- Engine -->
            <rect x="110" y="99" width="42" height="29"
                  rx="5" fill="#777" stroke="#333" stroke-width="3"/>
            <path d="M117 105 L145 105 M117 112 L145 112
                     M117 119 L145 119"
                  stroke="#333" stroke-width="3"/>

            <!-- Front fork and handlebar -->
            <g stroke="#bbb" stroke-width="6" stroke-linecap="round">
                <line x1="215" y1="78" x2="235" y2="130"/>
                <line x1="205" y1="62" x2="227" y2="64"/>
            </g>

            <!-- Headlight -->
            <circle cx="225" cy="70" r="10"
                    fill="#fff6a5" stroke="#e9a23b" stroke-width="3"/>

            <!-- Exhaust -->
            <path d="M95 115 L85 137 L125 137"
                  stroke="#aaa" stroke-width="8"
                  fill="none" stroke-linecap="round"/>

            <!-- Rider's body -->
            <circle cx="150" cy="29" r="17"
                    fill="#ffcc99" stroke="#333" stroke-width="3"/>

            <!-- Helmet -->
            <path d="M133 28 Q134 5 154 12
                     Q171 16 168 32 L155 29 L149 20 Z"
                  fill="#172554" stroke="#111" stroke-width="3"/>

            <!-- Rider's jacket -->
            <path d="M138 47 L163 47 L180 76
                     L157 87 L135 72 Z"
                  fill="#172554" stroke="#111" stroke-width="3"/>

            <!-- Arms -->
            <path d="M160 53 L190 62 L208 62"
                  stroke="#ffcc99" stroke-width="9"
                  fill="none" stroke-linecap="round"/>

            <!-- Legs -->
            <path d="M145 80 L124 105 L151 115"
                  stroke="#222" stroke-width="10"
                  fill="none" stroke-linecap="round"/>

            <path d="M161 80 L180 105 L160 119"
                  stroke="#222" stroke-width="10"
                  fill="none" stroke-linecap="round"/>

            <!-- Tail light -->
            <rect x="49" y="82" width="12" height="9"
                  rx="3" fill="#ff3030"/>

        </svg>
    </div>

    <div class="road"></div>

</div>

<script>
const motorcycle = document.getElementById("motorcycle");
const scene = document.getElementById("scene");
const rideButton = document.getElementById("rideButton");
const nightButton = document.getElementById("nightButton");

let isPaused = false;
let isNight = false;
let fast = false;

function toggleRide() {
    isPaused = !isPaused;

    motorcycle.style.animationPlayState =
        isPaused ? "paused" : "running";

    motorcycle.querySelector(".bike").style.animationPlayState =
        isPaused ? "paused" : "running";

    document.querySelectorAll(".wheel").forEach(wheel => {
        wheel.style.animationPlayState =
            isPaused ? "paused" : "running";
    });

    document.querySelector(".road").style.animationPlayState =
        isPaused ? "paused" : "running";

    document.querySelectorAll(".cloud").forEach(cloud => {
        cloud.style.animationPlayState =
            isPaused ? "paused" : "running";
    });

    rideButton.textContent =
        isPaused ? "▶ Resume Ride" : "⏸ Pause Ride";
}

function toggleNight() {
    isNight = !isNight;
    scene.classList.toggle("night", isNight);

    nightButton.textContent =
        isNight ? "☀ Day Mode" : "🌙 Night Mode";
}

function changeSpeed() {
    fast = !fast;

    motorcycle.style.animationDuration =
        fast ? "3s" : "7s";

    document.querySelectorAll(".wheel").forEach(wheel => {
        wheel.style.animationDuration =
            fast ? "0.2s" : "0.5s";
    });

    document.querySelector(".road").style.animationDuration =
        fast ? "0.4s" : "1s";
}
</script>

</body>
</html>
